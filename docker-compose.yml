services:
  portfolio:
    build: .
    container_name: rijon-portfolio
    ports:
      - "8080:5000"
    env_file:
      - path: server/.env
        required: false
    environment:
      - GITHUB_USER=RijonZ
      # Optional: raises the GitHub API rate limit
      # - GITHUB_TOKEN=your_token_here
    volumes:
      # Contact-form messages survive container restarts
      - portfolio-data:/app/storage
    restart: unless-stopped

volumes:
  portfolio-data:
